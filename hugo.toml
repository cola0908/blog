baseURL = "https://cola0908.com/"
locale = "zh-cn"
title = "cola0908的学习记录"
theme = "hugo-theme-stack"

defaultContentLanguage = "zh"
hasCJKLanguage = true

[pagination]
    pagerSize = 5

[params]
    mainSections = ["post"]
    rssFullContent = true
    favicon = "img/cola_0908.png"

    [params.sidebar]
        emoji = "✨"
        subtitle = "记录、思考与分享"
        avatar = "img/cola_0908.png"

    [params.article]
        headingAnchor = true
        math = false
        toc = true
        readingTime = true

        [params.article.license]
            enabled = true

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "archives", params = { limit = 5 } },
            { type = "categories", params = { limit = 10 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        page = [{ type = "toc" }]

    [params.colorScheme]
        toggle = true
        default = "auto"

    [params.footer]
        icp = "京ICP备2026054033号-1"
        icpLink = "https://beian.miit.gov.cn"
        publicSecurity = ""
        publicSecurityLink = ""

    [params.comments]
        enabled = false

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

[markup.goldmark.renderer]
    unsafe = true

[markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
